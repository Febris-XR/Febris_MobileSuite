# Runs the automated test suite on every pull request.
#
# WHAT IS TESTED HERE, AND WHAT CANNOT BE. tests/FebrisMobileP2pTests targets net8.0 and needs no
# Xamarin, so it runs on a stock Linux runner. It covers Febris.SharedMobileLibrary, which is where
# the P2P framing, the handshake and its coordinator, pairing sessions and secret storage,
# direction legality, safe file names, and the video packetizer live. That is the logic the two
# heads share and the part of the suite most worth breaking a pull request over.
#
# The two Android heads themselves are NOT built here. Both are Xamarin.Forms, which reached end of
# life in May 2024, and the Xamarin workloads were dropped from the GitHub-hosted runner images.
# The APKs are compiled locally and signed with a key that is deliberately never placed in CI. That
# is a recorded decision. So this job runs what can be run honestly, and the version-line job next
# to it checks the manifests without a compiler.
#
# WHY THIS EXISTS AT ALL. The suite has existed for some time and passed in about two seconds on a
# developer box, and nothing ran it. A safety net that runs nowhere is not one. This costs a minute
# or two of Linux time per pull request.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2p-tests:
    name: shared library test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The single project is named rather than the tests/ directory, because
      # tests/FebrisMobileTesting holds a manual Android harness that is not an automated suite
      # and is not in any solution. Pointing dotnet test at the directory would try to build it.
      - name: Run the suite
        run: dotnet test tests/FebrisMobileP2pTests/Febris.MobileP2p.Tests.csproj --configuration Release --nologo
